[project]
name = "approval-workflow-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.16",
    "fastapi>=0.136.3",
    "mangum>=0.21.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "moto>=5.2.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
